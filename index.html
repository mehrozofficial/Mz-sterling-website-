<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#fff;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}:root{--g:#d6ae52}
.top{height:35px;border-bottom:1px solid #292929;display:flex;justify-content:space-around;align-items:center;font-size:12px}
header{height:82px;border-bottom:1px solid #292929;display:flex;align-items:center;gap:20px;padding:0 28px;position:sticky;top:0;background:#070707f5;z-index:20}
.menu{background:#111;border:1px solid #444;color:#fff;border-radius:7px;font-size:24px;width:44px;height:44px}.logo{text-align:center;font:38px Georgia,serif;letter-spacing:3px;margin:auto}.logo small{display:block;font:10px Arial;letter-spacing:6px}.search{width:300px;background:#111;border:1px solid #444;border-radius:22px;padding:11px 16px;color:#fff}.cart{font-size:28px}
.drawer{position:fixed;top:117px;left:-280px;width:260px;padding:20px;background:#0b0b0b;border:1px solid #555;z-index:30;transition:.25s}.drawer.open{left:0}.drawer h3{margin:12px 0;color:var(--g)}.drawer p{padding:5px;color:#ddd}
.hero{min-height:390px;padding:65px 8%;display:flex;align-items:center;background:radial-gradient(circle at 78% 50%,#353535,#111 30%,#050505 70%);border-bottom:1px solid #292929}.eyebrow{color:var(--g);letter-spacing:2px}.hero h1{font:clamp(48px,7vw,82px) Georgia,serif;margin:10px 0}.hero p{font-size:17px;line-height:1.7;color:#ddd}.btn{display:inline-block;margin:25px 12px 0 0;padding:12px 30px;border:1px solid var(--g);border-radius:4px;background:linear-gradient(#e1bb63,#9b6e20);color:#fff}.btn.alt{background:transparent}
.wrap{max-width:1100px;margin:auto;padding:28px 18px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice div{min-height:150px;border:1px solid #4a3b20;padding:30px;background:#0d0d0d;cursor:pointer}.choice h2{font:32px Georgia,serif}.choice span{color:#aaa}.title{text-align:center;color:#ead8ae;font:25px Georgia,serif;margin:32px 0 18px}.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.cat{min-height:100px;border:1px solid #333;background:#0d0d0d;display:flex;align-items:end;justify-content:center;padding:12px;font-size:12px;cursor:pointer}.cat:hover,.card:hover{border-color:var(--g)}
.products{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{border:1px solid #333;background:#0c0c0c}.photo{height:185px;background:radial-gradient(circle at 50% 45%,#303030,#101010 48%,#050505 80%);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo svg{width:100%;height:100%;padding:8px;filter:drop-shadow(0 10px 10px #000)}.body{padding:12px}.body h3{font:16px Georgia,serif}.price{color:#e0b95d;font-weight:bold;margin:5px 0 10px}.order{display:block;border:1px solid #444;padding:8px;text-align:center;font-size:11px}.order:hover{color:#25d366;border-color:#25d366}
.features{display:grid;grid-template-columns:repeat(4,1fr);margin-top:28px;border:1px solid #333}.feature{text-align:center;padding:18px;border-right:1px solid #333}.feature:last-child{border:0}.feature b{display:block;color:#ead8ae}.feature span{color:#999;font-size:12px}.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.review{background:#0d0d0d;border:1px solid #292929;padding:22px;text-align:center}.stars{color:#f0c65f}.review p{color:#ccc;margin:8px 0}.review b{color:#e7d29d}
footer{border-top:1px solid #292929;margin-top:25px;padding:40px 5% 0}.footgrid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:25px}.foot h3{color:#e3c471;margin-bottom:12px}.foot p,.foot a{display:block;color:#999;font-size:13px;margin:7px 0}.powered{text-align:center;border-top:1px solid #3b301b;margin-top:25px;padding:20px;color:var(--g);font:bold 24px Georgia,serif;letter-spacing:1px}
.wa{position:fixed;right:20px;bottom:20px;min-height:58px;padding:0 24px 0 15px;border-radius:34px;background:#20c765;color:#fff;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.2px;box-shadow:0 8px 28px #0008;z-index:50;border:1px solid #31dc76}.wa svg{width:34px;height:34px;flex:0 0 34px}.wa:hover{background:#18b85a;transform:translateY(-2px)}
@media(max-width:850px){.search{display:none}.hero{min-height:430px;padding:55px 24px}.choice{grid-template-columns:1fr}.cats{grid-template-columns:repeat(3,1fr)}.products{grid-template-columns:repeat(2,1fr)}.features{grid-template-columns:1fr 1fr}.feature{border-bottom:1px solid #333}.reviews{grid-template-columns:1fr}.footgrid{grid-template-columns:1fr 1fr}.powered{font-size:17px}.logo{font-size:29px}}
</style>
